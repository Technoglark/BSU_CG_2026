<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная 2: Вариант 4 (FastAPI + Гистограммы)</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; width: 100%; max-width: 1000px; }
        .toolbar-group { background: white; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 250px; }
        .toolbar-group h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .button-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button, input { padding: 8px 12px; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; flex: 1; }
        input[type="file"] { background: #6c757d; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .canvas-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .box { display: flex; flex-direction: column; align-items: center; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .box-title { color: #555; font-weight: bold; margin-bottom: 10px; }
        
        canvas.img-canvas { border: 1px solid #ccc; max-width: 100%; margin-bottom: 10px; }
        canvas.hist-canvas { border: 1px solid #ddd; background: #fafafa; width: 256px; height: 100px; }
        .hist-label { font-size: 12px; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="controls">
        <div class="toolbar-group">
            <h3>Файл</h3>
            <div class="button-row">
                <input type="file" id="upload" accept="image/*">
                <button id="btnReset" disabled style="background:#dc3545; flex: 0.5;">Сброс</button>
            </div>
        </div>
        <div class="toolbar-group">
            <h3>Гистограммы и контраст</h3>
            <div class="button-row">
                <button id="btnLinear" disabled onclick="processImage('linear')">Линейное</button>
                <button id="btnEqRGB" disabled onclick="processImage('eq_rgb')">Эквал. (RGB)</button>
                <button id="btnEqHSV" disabled onclick="processImage('eq_hsv')">Эквал. (HSV)</button>
            </div>
        </div>
        <div class="toolbar-group">
            <h3>Сегментация</h3>
            <div class="button-row">
                <button id="btnPoints" disabled onclick="processImage('points')">Точки</button>
                <button id="btnLines" disabled onclick="processImage('lines')">Линии</button>
                <button id="btnSobel" disabled onclick="processImage('sobel')">Края (Собель)</button>
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <div class="box">
            <div class="box-title">Исходное изображение</div>
            <canvas id="srcCanvas" class="img-canvas"></canvas>
            <div class="hist-label">Гистограмма исходного</div>
            <canvas id="srcHist" class="hist-canvas" width="256" height="100"></canvas>
        </div>
        <div class="box">
            <div class="box-title">Результат</div>
            <canvas id="dstCanvas" class="img-canvas"></canvas>
            <div class="hist-label">Гистограмма результата</div>
            <canvas id="dstHist" class="hist-canvas" width="256" height="100"></canvas>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const srcCanvas = document.getElementById('srcCanvas');
        const dstCanvas = document.getElementById('dstCanvas');
        const ctxSrc = srcCanvas.getContext('2d', { willReadFrequently: true });
        const ctxDst = dstCanvas.getContext('2d', { willReadFrequently: true });
        
        let originalImg = new Image();
        const buttons = document.querySelectorAll('button');

        // Функция отрисовки гистограммы яркости
        function drawHistogram(imgCanvasId, histCanvasId) {
            const imgCanvas = document.getElementById(imgCanvasId);
            const histCanvas = document.getElementById(histCanvasId);
            const ctx = imgCanvas.getContext('2d');
            const hCtx = histCanvas.getContext('2d');
            
            // Защита от пустых холстов при старте
            if (imgCanvas.width === 0 || imgCanvas.height === 0) return;

            const imgData = ctx.getImageData(0, 0, imgCanvas.width, imgCanvas.height);
            const data = imgData.data;
            let hist = new Array(256).fill(0);

            // Считаем яркость (Luminance) каждого пикселя
            for (let i = 0; i < data.length; i += 4) {
                let lum = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
                hist[lum]++;
            }

            let maxCount = Math.max(...hist);
            hCtx.clearRect(0, 0, histCanvas.width, histCanvas.height);
            hCtx.fillStyle = '#444';

            // Отрисовка столбиков
            for (let i = 0; i < 256; i++) {
                let height = (hist[i] / maxCount) * histCanvas.height;
                hCtx.fillRect(i, histCanvas.height - height, 1, height);
            }
        }

        // Обработка загрузки файла
        upload.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                originalImg.onload = () => {
                    const MAX = 600;
                    let w = originalImg.width, h = originalImg.height;
                    if (w > MAX) { h *= MAX / w; w = MAX; }
                    srcCanvas.width = dstCanvas.width = w;
                    srcCanvas.height = dstCanvas.height = h;
                    
                    ctxSrc.drawImage(originalImg, 0, 0, w, h);
                    ctxDst.drawImage(originalImg, 0, 0, w, h);
                    
                    buttons.forEach(b => b.disabled = false);
                    
                    drawHistogram('srcCanvas', 'srcHist');
                    drawHistogram('dstCanvas', 'dstHist');
                };
                originalImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            ctxDst.drawImage(srcCanvas, 0, 0);
            drawHistogram('dstCanvas', 'dstHist');
        });

        // Отправка картинки на FastAPI сервер
        async function processImage(method) {
            const file = upload.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('method', method);

            try {
                const response = await fetch('http://127.0.0.1:8000/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Ошибка сервера');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                const resultImg = new Image();
                resultImg.onload = () => {
                    ctxDst.clearRect(0, 0, dstCanvas.width, dstCanvas.height);
                    ctxDst.drawImage(resultImg, 0, 0, dstCanvas.width, dstCanvas.height);
                    drawHistogram('dstCanvas', 'dstHist'); // Обновляем гистограмму результата
                    URL.revokeObjectURL(url);
                };
                resultImg.src = url;

            } catch (err) {
                console.error(err);
                alert("Ошибка соединения с бэкендом. Убедитесь, что сервер FastAPI запущен на порту 8000.");
            }
        }
    </script>
</body>
</html>
